interval:
  - interval: 15min
    then:
      - if:
          condition:
            lambda: return id(initial_boot_complete);
          then:
            - lambda: id(force_refresh) = true;
            - script.execute: check_and_update_display

display:
  - platform: waveshare_epaper
    id: epaper_display
    cs_pin: GPIO15   # P15 = CS
    dc_pin: GPIO27   # P27 = DC
    busy_pin:
      number: GPIO25
      inverted: true
    reset_pin: GPIO26 # P26 = RST
    model: 7.50in-bv3
    update_interval: never
    reset_duration: 2ms
    lambda: |-
      // Weather icon mapper
      auto get_weather_icon = [](const char* condition) -> const char* {
        if (strstr(condition, "clear-night"))         return "\U000F0594";
        else if (strstr(condition, "partlycloudy"))   return "\U000F0595";
        else if (strstr(condition, "cloudy"))         return "\U000F0590";
        else if (strstr(condition, "fog"))            return "\U000F0591";
        else if (strstr(condition, "hail"))           return "\U000F0592";
        else if (strstr(condition, "lightning-rainy"))return "\U000F067E";
        else if (strstr(condition, "lightning"))      return "\U000F0593";
        else if (strstr(condition, "pouring"))        return "\U000F0596";
        else if (strstr(condition, "snowy-rainy"))    return "\U000F067F";
        else if (strstr(condition, "rainy"))          return "\U000F0597";
        else if (strstr(condition, "snowy"))          return "\U000F0598";
        else if (strstr(condition, "sunny"))          return "\U000F0599";
        else if (strstr(condition, "windy-variant"))  return "\U000F059E";
        else if (strstr(condition, "windy"))          return "\U000F059D";
        else if (strstr(condition, "exceptional"))    return "\U000F05E1";
        return "\U000F0599"; // default: sunny
      };

      // Weather French description mapper
      auto get_weather_description_fr = [](const char* condition) -> const char* {
        if (strstr(condition, "clear-night"))          return "Nuit dégagée";
        else if (strstr(condition, "partlycloudy"))    return "Partiellement nuageux";
        else if (strstr(condition, "cloudy"))          return "Nuageux";
        else if (strstr(condition, "fog"))             return "Brouillard";
        else if (strstr(condition, "hail"))            return "Grêle";
        else if (strstr(condition, "lightning-rainy")) return "Orage avec pluie";
        else if (strstr(condition, "lightning"))       return "Orage";
        else if (strstr(condition, "pouring"))         return "Pluie abondante";
        else if (strstr(condition, "snowy-rainy"))     return "Neige et pluie";
        else if (strstr(condition, "rainy"))           return "Pluvieux";
        else if (strstr(condition, "snowy"))           return "Neigeux";
        else if (strstr(condition, "sunny"))           return "Ensoleillé";
        else if (strstr(condition, "windy-variant"))   return "Venteux (variable)";
        else if (strstr(condition, "windy"))           return "Venteux";
        else if (strstr(condition, "exceptional"))     return "Exceptionnel";
        return "Ensoleillé";  // default fallback
      };

      auto draw_soft_rounded_box = [&](int x, int y, int w, int h) {
        // Corner radius
        const int r = 4;

        // Horizontal lines (top & bottom)
        it.line(x + r, y,         x + w - r, y);         // Top
        it.line(x + r, y + h,     x + w - r, y + h);     // Bottom

        // Vertical lines (left & right)
        it.line(x,     y + r,     x,     y + h - r);     // Left
        it.line(x + w, y + r,     x + w, y + h - r);     // Right

        // Simulated rounded corners using short lines (1px diagonal)
        it.line(x + r - 1, y + 1,     x + r, y);         // Top-left
        it.line(x + w - r + 1, y + 1, x + w - r, y);     // Top-right
        it.line(x + r - 1, y + h - 1, x + r, y + h);     // Bottom-left
        it.line(x + w - r + 1, y + h - 1, x + w - r, y + h); // Bottom-right
      };

      // Thermostat widget
      auto draw_thermostat = [&](int x, int y, const char* name, Sensor* temp, Sensor* setpoint) {
        const int box_w = 145;
        const int box_h = 95;

        draw_soft_rounded_box(x - 4, y - 4, box_w, box_h);

        it.printf(x, y, id(font_small), TextAlign::TOP_LEFT, "%s", name);

        if (temp->has_state()) {
          it.print(x, y + 28, id(weather_icons), "\U000F050F");
          it.printf(x + 30, y + 25, id(font_large), "%.0f°", temp->state);
        } else {
          it.print(x + 30, y + 25, id(font_large), "--°");
        }

        if (setpoint->has_state()) {
          it.print(x, y + 60, id(weather_icons), "\U000F0493");
          it.printf(x + 35, y + 65, id(font_small), "%.0f°C", setpoint->state);
        } else {
          it.print(x + 35, y + 65, id(font_small), "--°C");
        }
      };

      auto draw_forecast = [&](int x, int y, const char* day_name, Sensor* high, Sensor* low, TextSensor* condition) {
        const int box_width = 100;
        const int box_h = 95;
        const int center_x = x + box_width / 2;

        // Day label (centered)
        it.printf(center_x, y, id(font_small), TextAlign::TOP_CENTER, "%s", day_name);

        // Icon (centered)
        if (condition->has_state()) {
          const char* icon_char = get_weather_icon(condition->state.c_str());
          it.print(center_x, y + 20, id(weather_icons), TextAlign::TOP_CENTER, icon_char);
        }

        // High/Low (centered)
        if (high->has_state()) {
          it.printf(center_x, y + 50, id(font_small), TextAlign::TOP_CENTER, "%2.0f°", high->state);
        } else {
          it.print(center_x, y + 50, id(font_small), TextAlign::TOP_CENTER, "--°");
        }

        if (low->has_state()) {
          it.printf(center_x, y + 70, id(font_xs), TextAlign::TOP_CENTER, "%2.0f°", low->state);
        } else {
          it.print(center_x, y + 70, id(font_xs), TextAlign::TOP_CENTER, "--°");
        }
      };


      // Etat texte HA nettoye ("" si absent / unknown / unavailable)
      auto clean = [](TextSensor* s) -> std::string {
        if (s == nullptr || !s->has_state()) return std::string();
        std::string v = s->state;
        if (v == "unknown" || v == "unavailable" || v == "None") return std::string();
        return v;
      };

      auto time = id(homeassistant_time).now();

      // La date du jour affiche remplace les deux titres : un gros nuage et
      // six thermostats n'ont pas besoin d'etiquette.
      {
        std::string d = clean(id(dashink_date));
        if (!d.empty()) {
          if (static_cast<unsigned char>(d[0]) < 0x80)
            d[0] = toupper(static_cast<unsigned char>(d[0]));
          it.printf(795, 5, id(font_large), TextAlign::TOP_RIGHT, "%s", d.c_str());
        }
      }

      // Current condition icon
      if (id(weather_condition).has_state()) {
        const char* condition = id(weather_condition).state.c_str();
        const char* icon_char = get_weather_icon(condition);
        it.print(8, 44, id(weather_icons_large), icon_char);
        it.print(152, 94, id(font_small), get_weather_description_fr(condition));
      }

      // Temperature : le gros chiffre se suffit, plus de thermometre
      if (id(ext_temp).has_state()) {
        it.printf(150, 44, id(font_xl), "%.1f°C", id(ext_temp).state);
      } else {
        it.print(150, 44, id(font_xl), "---.-°C");
      }

      // Humidite
      it.print(150, 124, id(weather_icons), "\U000F058E");
      if (id(ext_humidity).has_state()) {
        it.printf(186, 128, id(font_small), "%.0f%% humidité", id(ext_humidity).state);
      } else {
        it.print(186, 128, id(font_small), "--");
      }

      // Precipitations
      it.print(150, 156, id(weather_icons), "\U000F1A35");
      if (id(forecast0_precip).has_state()) {
        it.printf(186, 160, id(font_small), "%.0f%% précipitations", id(forecast0_precip).state);
      } else {
        it.print(186, 160, id(font_small), "--");
      }

      // Prévisions météo, calées sur le meme axe que le reste
      it.print(20, 200, id(font_small), "Prévisions météo");

      const char* jours_fr[7] = { "Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam" };
      int dow = id(homeassistant_time).now().day_of_week - 1;

      const char* jour0 = "Auj";
      const char* jour1 = "Dem";
      const char* jour2 = jours_fr[(dow + 2) % 7];
      const char* jour3 = jours_fr[(dow + 3) % 7];

      draw_soft_rounded_box(10, 226, 420, 99);

      draw_forecast(10, 230,  jour0, id(forecast0_high), id(forecast0_low), id(forecast0_condition));
      draw_forecast(115, 230, jour1, id(forecast1_high), id(forecast1_low), id(forecast1_condition));
      draw_forecast(220, 230, jour2, id(forecast2_high), id(forecast2_low), id(forecast2_condition));
      draw_forecast(325, 230, jour3, id(forecast3_high), id(forecast3_low), id(forecast3_condition));

      // Thermostat layout
      draw_thermostat(500, 50,  "Salon",     id(temp_salon),     id(setpoint_salon));
      draw_thermostat(650, 50,  "Cuisine",   id(temp_cuisine),   id(setpoint_cuisine));
      draw_thermostat(500, 150,  "Chambre",   id(temp_chambre),   id(setpoint_chambre));
      draw_thermostat(650, 150, "Éloi",      id(temp_eloi),      id(setpoint_eloi));
      draw_thermostat(500, 250, "Maxine",    id(temp_maxine),    id(setpoint_maxine));
      draw_thermostat(650, 250, "Brasserie", id(temp_brasserie), id(setpoint_brasserie));

      // ================= Bloc scolaire =================
      // y 348 bandeau du jour | rappel a droite
      // y 374 jour-cycle      | bandeau tenue de sport a droite
      // y 410 ELOI   y 432 MAXI   (pleine largeur, 760 px)
      {
        // Largeur reelle d'un texte : strlen compte les octets, et un accent
        // en vaut deux. Seul get_text_bounds donne la bonne valeur.
        auto tw = [&](const std::string &t, decltype(id(font_small)) f) -> int {
          int x1, y1, w, h;
          it.get_text_bounds(0, 0, t.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
          return w;
        };
        auto split = [](const std::string &s, char sep) -> std::vector<std::string> {
          std::vector<std::string> out;
          size_t p = 0;
          while (true) {
            size_t q = s.find(sep, p);
            out.push_back(s.substr(p, q == std::string::npos ? std::string::npos : q - p));
            if (q == std::string::npos) break;
            p = q + 1;
          }
          return out;
        };
        // cle a trois lettres -> glyphe MDI (voir sensor.ligne_*)
        auto glyphe = [](const std::string &k) -> const char* {
          if (k == "bib") return "\U000F05DA";
          if (k == "edu") return "\U000F070E";
          if (k == "ang") return "\U000F05CA";
          if (k == "mus") return "\U000F0F70";
          if (k == "tic") return "\U000F0322";
          if (k == "spo") return "\U000F0405";
          if (k == "pre") return "\U000F18FB";
          if (k == "pia") return "\U000F067D";
          if (k == "dan") return "\U000F15FB";
          if (k == "dru") return "\U000F0388";
          return "\U000F00EE";
        };

        std::string entete = clean(id(dashink_entete));
        std::string jour   = clean(id(school_day));
        std::string rappel = clean(id(dashink_rappel));
        std::string sport  = clean(id(dashink_sport));

        // Bandeau du jour affiche : AUJOURD'HUI ou DEMAIN · MERCREDI
        if (!entete.empty()) {
          bool demain = entete.rfind("DEMAIN", 0) == 0;
          int bw = tw(entete, id(font_xxs)) + 34;
          it.filled_rectangle(20, 343, bw, 21);
          it.print(26, 346, id(ico_s), COLOR_OFF, demain ? "\U000F1135" : "\U000F00F6");
          it.printf(46, 348, id(font_xxs), COLOR_OFF, "%s", entete.c_str());
        }

        // Ligne de rappel, alignee a droite
        if (!rappel.empty())
          it.printf(780, 342, id(font_small), TextAlign::TOP_RIGHT, "%s", rappel.c_str());

        // Jour-cycle
        if (!jour.empty())
          it.printf(20, 367, id(font_large), "%s", jour.c_str());

        // Bandeau tenue de sport, alignee a droite, en aplat inverse
        if (!sport.empty()) {
          int sw = tw(sport, id(font_xxs)) + 34;
          it.filled_rectangle(780 - sw, 369, sw, 25);
          it.print(786 - sw, 372, id(ico_m), COLOR_OFF, "\U000F15C8");
          it.printf(812 - sw, 375, id(font_xxs), COLOR_OFF, "%s", sport.c_str());
        }

        // Une ligne d'enfant : pastille inversee, puis icone + nom + heure
        auto ligne_enfant = [&](int y, const char *nom, TextSensor *src) {
          std::string raw = clean(src);
          if (raw.empty()) return;              // rien a dire : la ligne disparait
          int lw = tw(nom, id(font_xxs));
          it.filled_rectangle(20, y + 1, lw + 12, 18);
          it.printf(26, y + 4, id(font_xxs), COLOR_OFF, "%s", nom);
          int cx = 20 + lw + 22;
          std::vector<std::string> items = split(raw, ';');
          bool premier = true;
          for (size_t i = 0; i < items.size(); i++) {
            if (items[i].empty()) continue;     // un ';' en trop ne doit pas
                                                // produire un '·' orphelin
            std::vector<std::string> p = split(items[i], '|');
            std::string t;
            bool avec_icone = p.size() >= 2;
            if (avec_icone) {
              t = p[1];
              if (p.size() >= 3 && !p[2].empty()) t += " " + p[2];
            } else {
              t = items[i];                     // ancien format : texte brut
            }
            // on coupe proprement plutot que de deborder de l'ecran
            int besoin = (premier ? 0 : tw("·", id(font_small)) + 10)
                       + (avec_icone ? 23 : 0) + tw(t, id(font_small));
            if (cx + besoin > 780) break;
            if (!premier) {
              it.print(cx, y + 2, id(font_small), "·");
              cx += tw("·", id(font_small)) + 10;
            }
            premier = false;
            if (avec_icone) {
              it.print(cx, y, id(ico_m), glyphe(p[0]));
              cx += 23;
            }
            it.printf(cx, y + 2, id(font_small), "%s", t.c_str());
            cx += tw(t, id(font_small)) + 9;
          }
        };
        ligne_enfant(408, "ÉLOI", id(ligne_eloi));
        ligne_enfant(436, "MAXI", id(ligne_maxine));

        // Collecte : uniquement le soir de la veille, en aplat inverse
        std::string collecte = clean(id(dashink_collecte));
        if (!collecte.empty()) {
          int cw = tw(collecte, id(font_xxs)) + 30;
          it.filled_rectangle(780 - cw, 462, cw, 17);
          it.print(786 - cw, 463, id(ico_s), COLOR_OFF,
                   collecte.rfind("REC", 0) == 0 ? "\U000F044C" : "\U000F0A7A");
          it.printf(808 - cw, 464, id(font_xxs), COLOR_OFF, "%s", collecte.c_str());
        }
      }

      it.printf(10, 464, id(font_xxs), "MaJ: %02d-%02d %02d:%02d",
          time.month, time.day_of_month, time.hour, time.minute);