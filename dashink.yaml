  - platform: homeassistant
    id: forecast2_condition
    entity_id: sensor.forecast_day_2_condition

  - platform: homeassistant
    id: forecast3_condition
    entity_id: sensor.forecast_day_3_condition

  # ---- Bloc scolaire ----
  - platform: homeassistant
    id: school_day
    entity_id: sensor.today_s_school_event
    on_value: &refresh_display
      then:
        - if:
            condition:
              lambda: return id(initial_boot_complete);
            then:
              - lambda: id(force_refresh) = true;
              - script.execute: check_and_update_display

  - platform: homeassistant
