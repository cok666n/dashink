spi:
  clk_pin: GPIO13   # P13 = SCLK (HSPI CLK)
  mosi_pin: GPIO14  # P14 = DIN (HSPI MOSI)
  miso_pin: GPIO12  # HSPI MISO (unused but required)
  interface: hardware

